<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <!-- Gradients -->
    <linearGradient id="nexusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Icon Container -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Outer Hexagon Shield -->
    <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="url(#nexusGradient)" />
    <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" fill="#0B0F19" />
    
    <!-- AI Nexus Node Structure (Interconnected N) -->
    <circle cx="32" cy="35" r="5" fill="#06B6D4" />
    <circle cx="32" cy="65" r="5" fill="#3B82F6" />
    <circle cx="68" cy="35" r="5" fill="#8B5CF6" />
    <circle cx="68" cy="65" r="5" fill="#EC4899" />
    <circle cx="50" cy="50" r="7" fill="url(#nexusGradient)" />

    <!-- Connecting Rays -->
    <line x1="32" y1="35" x2="32" y2="65" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" />
    <line x1="32" y1="35" x2="50" y2="50" stroke="url(#nexusGradient)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="50" y1="50" x2="68" y2="65" stroke="url(#nexusGradient)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="68" y1="35" x2="68" y2="65" stroke="#EC4899" stroke-width="3.5" stroke-linecap="round" />
    <line x1="32" y1="65" x2="50" y2="50" stroke="#06B6D4" stroke-width="2" stroke-dasharray="2,2" />
    <line x1="50" y1="50" x2="68" y2="35" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="2,2" />
    
    <!-- Inner Core Sparkle -->
    <circle cx="50" cy="50" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 30)">
    <!-- Edu -->
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Edu</text>
    <!-- Nexus -->
    <text x="84" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#nexusGradient)" letter-spacing="-0.5">Nexus</text>
    
    <!-- Tagline Badge -->
    <rect x="2" y="56" width="230" height="20" rx="10" fill="url(#nexusGradient)" fill-opacity="0.15" />
    <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="1.5">AI LEARNING PLATFORM</text>
  </g>
</svg>
