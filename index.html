<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduNexus — AI-Powered Personalized Learning & Early Intervention Platform</title>

  <!-- External & System Stylesheets -->
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

  <!-- ============================================================
       1. APPLICATION LOADING SPLASH SCREEN
       ============================================================ -->
  <div id="splash-screen" class="splash-screen">
    <div style="text-align: center;" class="animate-pulse-glow">
      <img src="./assets/logo.svg" alt="EduNexus Logo" style="height: 64px; width: auto; margin-bottom: 1.5rem;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
        <div class="spinner"></div>
        <span style="font-size: 0.9rem; color: var(--text-secondary); font-weight: 600; letter-spacing: 1px;">
          PERSONALIZED LEARNING • POWERED BY AI
        </span>
      </div>
    </div>
  </div>

  <!-- ============================================================
       2. AUTHENTICATION CONTAINER (LOGIN & REGISTER)
       ============================================================ -->
  <div id="auth-view-wrapper" class="auth-wrapper">
    <div class="auth-bg-blob auth-bg-blob-1"></div>
    <div class="auth-bg-blob auth-bg-blob-2"></div>
    
    <div id="auth-view-container" class="w-full flex justify-center">
      <!-- Injected dynamically by router.js -->
    </div>
  </div>

  <!-- ============================================================
       3. MAIN APPLICATION DASHBOARD SHELL
       ============================================================ -->
  <div id="app-shell" class="app-container" style="display: none;">
    
    <!-- Sidebar Navigation -->
    <aside id="app-sidebar" class="app-sidebar">
      <div class="sidebar-header">
        <a class="sidebar-brand magnetic-target">
          <img src="./assets/logo.svg" alt="EduNexus">
        </a>
        <button id="sidebar-toggle" class="sidebar-toggle-btn" title="Toggle Sidebar">
          &#8942;
        </button>
      </div>

      <!-- Navigation Items injected dynamically based on role -->
      <nav id="sidebar-nav-items" class="sidebar-nav">
        <!-- Injected by router.js -->
      </nav>

      <!-- Sidebar User Profile Footer -->
      <div class="sidebar-footer">
        <div id="sidebar-user-avatar" class="user-avatar">S</div>
        <div class="user-info">
          <span id="sidebar-user-name" class="user-name">Demo Student</span>
          <span id="sidebar-user-role" class="user-role">STUDENT</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Top Sticky Header -->
      <header class="app-header">
        <div class="header-welcome">
          <h2 id="header-welcome-text">Good morning, Student 👋</h2>
        </div>

        <div class="header-actions">
          <button class="btn btn-secondary btn-sm" onclick="Router.navigate('/settings')">⚙️ Settings</button>
          <button class="btn btn-outline btn-sm" onclick="Auth.logout()">Logout</button>
        </div>
      </header>

      <!-- Dynamic Page Body -->
      <div id="page-body-container" class="page-body">
        <!-- Page contents rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- ============================================================
       4. JAVASCRIPT MODULE STACK
       ============================================================ -->
  <script src="./js/storage.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/ai-engine.js"></script>
  <script src="./js/quiz.js"></script>
  <script src="./js/learning-path.js"></script>
  <script src="./js/student.js"></script>
  <script src="./js/teacher.js"></script>
  <script src="./js/admin.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/animations.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
