<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduNexus — AI-Powered Personalized Learning & Early Intervention</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet System -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- SPLASH ENTRANCE SCREEN -->
  <div id="edunexus-splash-screen" class="splash-screen-overlay">
    <div class="splash-logo-wrapper">
      <img src="assets/logo.png" alt="EduNexus — Personalized Learning Platform" class="splash-logo-img">
    </div>
  </div>

  <!-- SPA AUTHENTICATION VIEW WRAPPER -->
  <div id="auth-view-wrapper" style="display: block;"></div>

  <!-- SPA APPLICATION SHELL (PERMANENT FIXED SIDEBAR & HEADER) -->
  <div id="app-shell" class="app-container" style="display: none;">
    <!-- PERMANENT FIXED SIDEBAR WITH USER FOOTER -->
    <aside id="sidebar-container" class="app-sidebar">
      <div class="sidebar-header">
        <a class="sidebar-brand magnetic-target" onclick="Router.navigate('/student')" title="EduNexus">
          <img src="assets/logo.png" alt="EduNexus — Personalized Learning Platform" class="edunexus-logo-img sidebar-logo-img">
        </a>
      </div>

      <!-- Navigation Links Scrollable Area -->
      <nav id="sidebar-nav-items" class="sidebar-nav"></nav>

      <!-- PERMANENT SIDEBAR FOOTER USER SECTION -->
      <div class="sidebar-footer">
        <div id="sidebar-user-avatar" class="user-avatar" onclick="App.toggleProfileDropdown()">S</div>
        <div class="user-info">
          <span id="sidebar-user-name" class="user-name">Demo Student</span>
          <span id="sidebar-user-role" class="user-role">STUDENT</span>
        </div>
        <button onclick="Auth.confirmLogout()" class="btn btn-secondary btn-sm" style="margin-left: auto; padding: 0.35rem 0.55rem;" title="Logout">
          🚪
        </button>
      </div>
    </aside>

    <!-- MAIN DASHBOARD CONTENT AREA -->
    <main class="app-main">
      <!-- Top Sticky App Header with Utility Controls -->
      <header class="app-header">
        <!-- Header Utility Actions (Eye Care, Notifications, Profile) -->
        <div class="header-actions">
          <button class="btn btn-secondary btn-sm" onclick="App.toggleEyeCareTheme()" title="Toggle Eye Protection Mode">
            👁 <span style="font-size:0.75rem; font-weight:700;">Eye Care</span>
          </button>

          <button class="btn btn-secondary btn-sm" onclick="Notifications.toast('You have no unread notifications.', 'info')" title="Notifications">
            🔔 <span class="badge badge-cyan" style="padding: 0.1rem 0.4rem;">0</span>
          </button>
          
          <div style="position: relative;">
            <button class="btn btn-outline btn-sm" onclick="App.toggleProfileDropdown()" title="Profile Account Menu">
              👤 Profile ▼
            </button>
            <div id="header-profile-dropdown" class="header-profile-dropdown">
              <a class="dropdown-item" onclick="Router.navigate('/settings')">⚙️ Settings</a>
              <div style="height: 1px; background: var(--border-color); margin: 0.35rem 0;"></div>
              <a class="dropdown-item text-danger" onclick="Auth.confirmLogout()">🚪 Logout</a>
            </div>
          </div>
        </div>
      </header>

      <!-- Page Body Container (Dynamic SPA Router View) -->
      <div id="page-body-container" class="page-body"></div>
    </main>
  </div>

  <!-- GLOBAL MODAL OVERLAY CONTAINER -->
  <div id="global-modal-overlay" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="global-modal-title" class="modal-title">Notification</h3>
        <button class="modal-close" onclick="Notifications.closeModal()">&times;</button>
      </div>
      <div id="global-modal-body" class="modal-body"></div>
      <div id="global-modal-footer" class="modal-footer">
        <button class="btn btn-primary" onclick="Notifications.closeModal()">OK</button>
      </div>
    </div>
  </div>

  <!-- GLOBAL TOAST CONTAINER -->
  <div id="global-toast-container" class="toast-container"></div>

  <!-- JAVASCRIPT MODULAR STACK -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/learning-path.js"></script>
  <script src="js/mindful-break.js"></script>
  <script src="js/student.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/subject.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
