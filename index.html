<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduNexus — AI-Powered Personalized Learning & Early Intervention</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet System -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- SPLASH ENTRANCE SCREEN -->
  <div id="edunexus-splash-screen" class="splash-screen-overlay">
    <div class="splash-logo-wrapper">
      <img src="assets/logo.png" alt="EduNexus — Personalized Learning Platform" class="splash-logo-img">
    </div>
  </div>

  <!-- SPA AUTHENTICATION VIEW WRAPPER -->
  <div id="auth-view-wrapper" style="display: block;"></div>

  <!-- SPA APPLICATION SHELL (PERMANENT FIXED SIDEBAR & HEADER) -->
  <div id="app-shell" class="app-container" style="display: none;">
    <!-- PERMANENT FIXED SIDEBAR WITH USER FOOTER -->
    <aside id="sidebar-container" class="app-sidebar">
      <div class="sidebar-header">
        <a class="sidebar-brand magnetic-target" onclick="Router.navigateDashboard()" title="EduNexus">
          <div class="sidebar-brand-logo-badge">
            <img src="assets/logo.png" alt="EduNexus" class="edunexus-logo-img sidebar-logo-img">
          </div>
          <div class="sidebar-brand-text-container">
            <span class="sidebar-brand-title">EduNexus</span>
            <span class="sidebar-brand-tagline">Learn • Grow • Achieve</span>
          </div>
        </a>
      </div>

      <!-- Navigation Links Scrollable Area -->
      <nav id="sidebar-nav-items" class="sidebar-nav"></nav>

      <!-- PERMANENT SIDEBAR FOOTER USER SECTION -->
      <div class="sidebar-footer">
        <div id="sidebar-user-avatar" class="user-avatar" onclick="App.toggleProfileDropdown()">S</div>
        <div class="user-info">
          <span id="sidebar-user-name" class="user-name">Demo Student</span>
          <span id="sidebar-user-role" class="user-role">STUDENT</span>
        </div>
        <button onclick="Auth.confirmLogout()" class="btn btn-secondary btn-sm" style="margin-left: auto; padding: 0.35rem 0.55rem;" title="Logout">
          🚪
        </button>
      </div>
    </aside>

    <!-- MAIN DASHBOARD CONTENT AREA -->
    <main class="app-main">
      <!-- Top Sticky App Header with Utility Controls -->
      <header class="app-header">
        <div class="header-actions">
          <!-- SINGLE HORIZONTAL GLASS CAPSULE -->
          <div class="glass-header-capsule">
            <!-- 1. NEXAAI PILL -->
            <button class="capsule-item capsule-nexaai" onclick="App.openNexaAIChat()" title="✦ NexaAI Assistant">
              <span class="capsule-icon">✦</span>
              <span class="capsule-text">NexaAI</span>
            </button>

            <div class="capsule-divider"></div>

            <!-- 2. EYE CARE CONTROL -->
            <button class="capsule-item capsule-eyecare" onclick="App.toggleEyeCareTheme()" title="Toggle Eye Protection Mode">
              <span class="capsule-icon">◉</span>
              <span class="capsule-text">Eye Care</span>
            </button>

            <div class="capsule-divider"></div>

            <!-- 3. NOTIFICATION BADGE -->
            <button class="capsule-item capsule-notification" onclick="Notifications.toast('You have no unread notifications.', 'info')" title="Notifications">
              <span class="capsule-icon">🔔</span>
              <span class="capsule-badge">0</span>
            </button>

            <div class="capsule-divider"></div>

            <!-- 4. STUDENT NAME (PLAIN TEXT - NO DROPDOWN ARROW) -->
            <div class="capsule-item capsule-user-name" title="Current Active User">
              <span id="header-user-name">Rahul Meena</span>
            </div>

            <div class="capsule-divider"></div>

            <!-- 5. LOGOUT PILL -->
            <button class="capsule-item capsule-logout" onclick="Auth.logout()" title="Log out of EduNexus">
              <span class="capsule-text">Logout</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Page Body Container (Dynamic SPA Router View) -->
      <div id="page-body-container" class="page-body"></div>
    </main>
  </div>

  <!-- FLOATING ROUND NEXAAI ACTION BUTTON (FIXED BOTTOM-RIGHT) -->
  <button class="nexaai-round-fab" onclick="App.openNexaAIChat()" title="✦ Ask NexaAI Assistant">
    <span style="font-size:1.3rem;">✦</span>
  </button>

  <!-- GLOBAL MODAL OVERLAY CONTAINER -->
  <div id="global-modal-overlay" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="global-modal-title" class="modal-title">Notification</h3>
        <button class="modal-close" onclick="Notifications.closeModal()">&times;</button>
      </div>
      <div id="global-modal-body" class="modal-body"></div>
      <div id="global-modal-footer" class="modal-footer">
        <button class="btn btn-primary" onclick="Notifications.closeModal()">OK</button>
      </div>
    </div>
  </div>

  <!-- GLOBAL TOAST CONTAINER -->
  <div id="global-toast-container" class="toast-container"></div>

  <!-- JAVASCRIPT MODULAR STACK -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/learning-path.js"></script>
  <script src="js/mindful-break.js"></script>
  <script src="js/student.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/subject.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
